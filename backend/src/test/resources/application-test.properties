# ==============================================================================
# TechCare Automated Test Configuration (H2 In-Memory)
# ==============================================================================
spring.application.name=techcare-backend-test

spring.datasource.url=jdbc:h2:mem:techcare_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

techcare.app.jwtSecret=TestSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026Secure
techcare.app.jwtExpirationMs=3600000

techcare.supabase.url=https://test.supabase.co
techcare.supabase.key=test_key
techcare.supabase.bucket=test-bucket

logging.level.root=WARN
logging.level.com.techcare=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
