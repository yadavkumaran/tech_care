# ==============================================================================
# TechCare Spring Boot Configuration (PostgreSQL / Supabase)
# ==============================================================================

spring.application.name=techcare-backend
server.port=8080

# ------------------------------------------------------------------------------
# PostgreSQL / Supabase Datasource Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.alskjcnkslmgkwokaopw
spring.datasource.password=yadavkumaran
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TechCareHikariCP

# ------------------------------------------------------------------------------
# JPA / Hibernate Settings
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ------------------------------------------------------------------------------
# JWT (JSON Web Token) Security Settings
# ------------------------------------------------------------------------------
techcare.app.jwtSecret=TechCareSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026Secure
techcare.app.jwtExpirationMs=86400000

# ------------------------------------------------------------------------------
# Supabase Storage Configuration (Intake damage photos, invoices)
# ------------------------------------------------------------------------------
techcare.supabase.url=https://alskjcnkslmgkwokaopw.supabase.co
techcare.supabase.bucket=techcare-attachments

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.techcare=DEBUG
logging.level.org.springframework.security=INFO
