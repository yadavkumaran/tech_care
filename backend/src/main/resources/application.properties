# ==============================================================================
# TechCare Spring Boot Configuration (PostgreSQL / Supabase)
# All sensitive credentials MUST be provided via environment variables.
# See .env.example for required configuration keys.
# ==============================================================================

spring.application.name=techcare-backend
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# PostgreSQL / Supabase Datasource Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TechCareHikariCP

# ------------------------------------------------------------------------------
# JPA / Hibernate Settings
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# ------------------------------------------------------------------------------
# JWT (JSON Web Token) Security Settings
# ------------------------------------------------------------------------------
techcare.app.jwtSecret=${TECHCARE_JWT_SECRET}
techcare.app.jwtExpirationMs=${TECHCARE_JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# Supabase Storage Configuration
# ------------------------------------------------------------------------------
techcare.supabase.url=${TECHCARE_SUPABASE_URL:https://supabase.co}
techcare.supabase.key=${TECHCARE_SUPABASE_KEY:}
techcare.supabase.bucket=${TECHCARE_SUPABASE_BUCKET:techcare-attachments}

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.techcare=INFO
logging.level.org.springframework.security=WARN
