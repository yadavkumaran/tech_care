# ==============================================================================
# TechCare Spring Boot Configuration (PostgreSQL / Supabase)
# ==============================================================================

spring.application.name=techcare-backend
server.port=8080

# ------------------------------------------------------------------------------
# PostgreSQL / Supabase Datasource Configuration
# Replace [YOUR_PASSWORD] and [YOUR_PROJECT_REF] with your Supabase credentials
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.YOUR_PROJECT_REF
spring.datasource.password=YOUR_SUPABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TechCareHikariCP

# ------------------------------------------------------------------------------
# JPA / Hibernate Settings
# ------------------------------------------------------------------------------
# 'validate' verifies entity mappings against the existing Supabase schema without altering tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# JWT (JSON Web Token) Security Settings
# Secret must be at least 256 bits (32+ characters)
# ------------------------------------------------------------------------------
techcare.app.jwtSecret=TechCareSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026Secure
techcare.app.jwtExpirationMs=86400000

# ------------------------------------------------------------------------------
# Supabase Storage Configuration (Intake damage photos, invoices)
# ------------------------------------------------------------------------------
techcare.supabase.url=https://YOUR_PROJECT_REF.supabase.co
techcare.supabase.key=YOUR_SUPABASE_SERVICE_ROLE_OR_ANON_KEY
techcare.supabase.bucket=techcare-attachments

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.techcare=DEBUG
logging.level.org.springframework.security=INFO

